  :root {
    --bg: #070c12;
    --bg-image:
      repeating-linear-gradient(0deg, rgba(120,200,255,0.07) 0px, rgba(120,200,255,0.07) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(120,200,255,0.07) 0px, rgba(120,200,255,0.07) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(0deg, rgba(56,224,216,0.025) 0px, rgba(56,224,216,0.025) 1px, transparent 1px, transparent 3px);
    --surface: rgba(10,18,26,0.92);
    --surface2: rgba(14,26,36,0.96);
    --border: rgba(130,230,255,0.20);
    --text: #dff4f7;
    --muted: #6f93a3;
    --accent: #38e0d8;
    --accent2: #ffb454;
    --mark-bg: rgba(56,224,216,0.3);
    --radius: 3px;
    --radius-sm: 3px;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    background-image: var(--bg-image);
    color: var(--text);
    font-family: var(--font-mono);
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    backdrop-filter: blur(10px);
  }

  .topbar-inner {
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #search, #category-select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: var(--font-mono);
    outline: none;
    transition: border-color 0.15s ease;
  }

  #search:focus, #category-select:focus { border-color: var(--accent); }
  #search::placeholder { color: var(--muted); }
  #category-select { cursor: pointer; }

  #search:focus-visible, #category-select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    counter-reset: cat-index;
  }

  .category { margin-bottom: 36px; counter-increment: cat-index; }

  .category-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .category-title::before {
    content: "SEZ." counter(cat-index, decimal-leading-zero) " —";
    color: var(--muted);
    font-size: 0.85em;
  }

  .category-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .subcategory { margin-bottom: 22px; }
  .subcategory:last-child { margin-bottom: 0; }

  .subcategory-title {
    font-size: 13px;
    color: var(--text);
    margin: 0 0 8px;
    padding-left: 2px;
  }

  .subcategory-title::before {
    content: "> ";
    color: var(--accent);
  }

  .items {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    counter-reset: item-index;
  }

  .item {
    counter-increment: item-index;
    display: grid;
    grid-template-columns: 2.4rem 1fr;
    column-gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    border-left: 2px solid transparent;
    transition: background 0.15s ease, border-left-color 0.15s ease;
  }

  .items .item:last-child { border-bottom: none; }

  .item::before {
    content: counter(item-index, decimal-leading-zero);
    grid-column: 1;
    grid-row: 1 / 3;
    font-size: 0.7rem;
    color: var(--muted);
    padding-top: 0.2rem;
  }

  .item:hover { background: var(--surface2); border-left-color: var(--accent); }

  .item-site { grid-column: 2; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .item-site a {
    color: var(--accent);
    text-decoration: none;
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 500;
    word-break: break-all;
  }
  .item-site a:hover { text-decoration: underline; }
  .item-site a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .item-body { grid-column: 2; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .item-desc { font-size: 13.5px; color: var(--text); }
  .item-note {
    font-size: 12.5px;
    color: var(--muted);
    padding: 6px 10px;
    background: rgba(255,180,84,0.08);
    border-left: 2px solid var(--accent2);
    border-radius: 0 4px 4px 0;
  }

  mark {
    background: var(--mark-bg);
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 14px;
  }

  @media (max-width: 640px) {
    .item { grid-template-columns: 1.6rem 1fr; column-gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>

    "Video": [
      {
        "sito": "vdo.ninja",
        "spiegazione": "Tool per portare feed video remoti in OBS via WebRTC",
        "note": ""

    ],
    "Directory": [
      {
        "sito": "fmhy.net",
        "spiegazione": "Directory community-driven di risorse gratuite su web (media, tool, software, dev)",
        "note": "Alcuni link ospitati puntano a contenuti piratati/streaming; il sito in sé è legittimo"
      },
      {
        "sito": "project-awesome.org",
        "spiegazione": "Directory delle liste \"awesome\" di progetti open source su GitHub",
        "note": ""
      },
      {

</script>
<script>
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const mainEl = document.getElementById('main');
  const searchEl = document.getElementById('search');
  const selectEl = document.getElementById('category-select');

  let activeCategory = null;

  const categories = Object.keys(DATA);

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function highlight(text, q){
    if(!q) return escapeHtml(text);
    const esc = escapeHtml(text);
    const escQ = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return esc.replace(new RegExp(escQ, 'ig'), m => `<mark>${m}</mark>`);
  }

  function buildSelect(){
    selectEl.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = '';
    allOpt.textContent = 'Tutte le categorie';
    selectEl.appendChild(allOpt);

    for(const cat of categories){
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      selectEl.appendChild(opt);
    }

    selectEl.addEventListener('change', () => {
      activeCategory = selectEl.value || null;
      render();
      window.scrollTo({top: 0, behavior: 'smooth'});
    });
  }

  function render(){
    const q = searchEl.value.trim().toLowerCase();

    const filterFn = (cat, sub, it) => {
      if(activeCategory && cat !== activeCategory) return false;
      if(!q) return true;
      const haystack = (it.sito + ' ' + it.spiegazione + ' ' + (it.note||'') + ' ' + cat + ' ' + sub).toLowerCase();
      return haystack.includes(q);
    };

    mainEl.innerHTML = '';
    let shown = 0;

    for(const cat of categories){
      if(activeCategory && cat !== activeCategory) continue;
      const subs = DATA[cat];
      let catHasContent = false;
      const catEl = document.createElement('div');
      catEl.className = 'category';

      const catTitle = document.createElement('div');
      catTitle.className = 'category-title';
      catTitle.textContent = cat;
      catEl.appendChild(catTitle);

      for(const sub of Object.keys(subs)){
        const items = subs[sub].filter(it => filterFn(cat, sub, it));
        if(items.length === 0) continue;
        catHasContent = true;

        const subEl = document.createElement('div');
        subEl.className = 'subcategory';

        const subTitle = document.createElement('div');
        subTitle.className = 'subcategory-title';
        subTitle.textContent = sub;
        subEl.appendChild(subTitle);

        const itemsEl = document.createElement('div');
        itemsEl.className = 'items';

        for(const it of items){
          shown++;
          const itemEl = document.createElement('div');
          itemEl.className = 'item';

          const url = it.sito.startsWith('http') ? it.sito : 'https://' + it.sito;

          const siteEl = document.createElement('div');
          siteEl.className = 'item-site';
          siteEl.innerHTML = `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${highlight(it.sito, q)}</a>`;

          const bodyEl = document.createElement('div');
          bodyEl.className = 'item-body';
          let bodyHtml = `<div class="item-desc">${highlight(it.spiegazione, q)}</div>`;
          if(it.note && it.note.trim()){
            bodyHtml += `<div class="item-note">${highlight(it.note, q)}</div>`;
          }
          bodyEl.innerHTML = bodyHtml;

          itemEl.appendChild(siteEl);
          itemEl.appendChild(bodyEl);
          itemsEl.appendChild(itemEl);
        }

        subEl.appendChild(itemsEl);
        catEl.appendChild(subEl);
      }

      if(catHasContent) mainEl.appendChild(catEl);
    }

    if(shown === 0){
      mainEl.innerHTML = '<div class="empty">Nessun risultato</div>';
    }
  }

  buildSelect();
  searchEl.addEventListener('input', render);
  render();
</script>

</body>
</html>
